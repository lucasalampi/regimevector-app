# Builds the RegimeVector web terminal (the same app as the phone build, laid out for a computer
# in wide windows) and deploys it to Cloudflare Pages on every push to main.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Create the Pages project once (Workers & Pages → Create → Pages → Upload assets, name it
# "regimevector"), or set the repository variable CF_PAGES_PROJECT to your project's name.
# Without the secrets the workflow still builds and attaches the site as a downloadable artifact.
# Keep it private with Cloudflare Access (Zero Trust → Access → Applications) on the Pages domain.
name: Deploy web terminal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Build data (archive + content → src/data)
        run: npm run build:data

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export web
        run: npx expo export --platform web
        env:
          EXPO_NO_TELEMETRY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: regimevector-web
          path: app/dist
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name="${{ vars.CF_PAGES_PROJECT || 'regimevector' }}" --branch=main
